{% extends "base.html" %}

{% block title %}{{ section.title }} · magicaedo{% endblock title %}

{% block content %}
<h1 class="title">{{ section.title }}</h1>
<ul class="post-list">
  {% for page in section.pages %}
  <li>
    <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    <time>{{ page.date | date(format="%d %b %Y") }}</time>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
