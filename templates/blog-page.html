{% extends "base.html" %}

{% block title %}{{ page.title }} · magicaedo{% endblock title %}

{% block content %}
<h1 class="title">{{ page.title }}</h1>
{% if page.slug != "about" %}
<p class="subtitle">{{ page.date | date(format="%d %B %Y") }}</p>
{% endif %}
{{ page.content | safe }}
<hr>
<p class="back-link"><a href="{{ get_url(path="@/blog/_index.md") }}">&larr; volver al blog</a></p>
{% endblock content %}
